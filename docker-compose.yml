services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  mysqld-exporter-pg:
    image: prom/mysqld-exporter:v0.16.0
    container_name: mysqld-exporter-pg
    command:
      - --mysqld.address=host.docker.internal:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: exporter
    ports:
      - "9104:9104"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mysqld-exporter-card:
    image: prom/mysqld-exporter:v0.16.0
    container_name: mysqld-exporter-card
    command:
      - --mysqld.address=host.docker.internal:3307
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: exporter
    ports:
      - "9105:9104"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  prometheus-data:
  grafana-data:
